name: Build AdvancedPanel Dylib

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  dylib:
    name: macOS universal dylib
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      # Finds the directory holding CMakeLists.txt, wherever you put it.
      - name: Locate sources
        id: src
        run: |
          echo "--- repository tree ---"
          find . -path ./.git -prune -o -type f -print | sort
          echo "------------------------"
          FILE=$(find . -path ./.git -prune -o -name CMakeLists.txt -type f -print | head -n 1)
          if [ -z "$FILE" ]; then
            echo "::error::No CMakeLists.txt found in the repository."
            echo "::error::Add CMakeLists.txt next to panel.cpp and advanced_panel.h."
            exit 1
          fi
          DIR=$(dirname "$FILE")
          echo "Found CMakeLists.txt at: $FILE"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Configure
        run: |
          cmake -S "${{ steps.src.outputs.dir }}" -B build/macos \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DAP_BUILD_OBJC=OFF \
            -DAP_BUILD_EXAMPLES=OFF

      - name: Build
        run: cmake --build build/macos --config ${{ env.BUILD_TYPE }} -j $(sysctl -n hw.ncpu)

      - name: Verify universal slice
        run: |
          ARCHS=$(lipo -info build/macos/libadvanced_panel.dylib)
          echo "$ARCHS"
          echo "$ARCHS" | grep -q "arm64"
          echo "$ARCHS" | grep -q "x86_64"

      - name: Verify exported ABI
        run: |
          nm -gU build/macos/libadvanced_panel.dylib | grep -q "_ap_create"
          nm -gU build/macos/libadvanced_panel.dylib | grep -q "_ap_serialize"

      - name: Package
        run: |
          mkdir -p dist
          cp build/macos/libadvanced_panel.dylib dist/
          cp "${{ steps.src.outputs.dir }}/advanced_panel.h" dist/
          cd dist && zip -r ../AdvancedPanel-dylib.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: AdvancedPanel-dylib
          path: AdvancedPanel-dylib.zip
